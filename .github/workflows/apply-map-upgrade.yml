name: Apply map upgrade

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-map-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, name):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"patch target not found: {name}")
              return text.replace(old, new, 1)

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace("const APP_VERSION = '0.1.0';", "const APP_VERSION = '0.2.0';", 1)
          app = replace_once(
              app,
              "    './app.js',\n    './styles.css',",
              "    './app.js',\n    './enhancements.js',\n    './styles.css',",
              'app offline enhancements'
          )
          app = replace_once(
              app,
              "    './data/catalog.json'\n  ];",
              "    './data/catalog.json',\n    './data/alos2/catalog.json'\n  ];",
              'app offline alos catalog'
          )
          renderer_marker = """  const renderer = new GeoCanvasRenderer(dom.mapCanvas, dom.mapPopup, {
            onViewChanged: (view) => {
              clearTimeout(persistViewTimer);
              persistViewTimer = setTimeout(() => {
                if (activePack) setSetting(`view:${activePack.id}`, view).catch(console.error);
              }, 500);
            }
          });
          """
          renderer_export = renderer_marker + """
          window.SAIKAN = {
            renderer,
            get activePack() { return activePack; },
            get activeData() { return activeData; },
            get catalog() { return catalog; },
            installPackFromUrl,
            installPackBuffer,
            toast,
            formatBytes
          };
          """
          app = replace_once(app, renderer_marker, renderer_export, 'renderer api export')
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace("img-src 'self' data: blob:;", "img-src 'self' data: blob: https:;", 1)
          index = index.replace('<title>災害オフライン3Dマップ</title>', '<title>災観 SAIKAN - オフライン3D災害状況マップ</title>', 1)
          index = index.replace('<h1>災害オフライン3Dマップ</h1>', '<h1>災観 SAIKAN</h1>', 1)
          index = replace_once(
              index,
              '  <script defer src="./app.js"></script>',
              '  <script defer src="./app.js"></script>\n  <script defer src="./enhancements.js"></script>',
              'enhancements script'
          )
          old_region = """        <label for="packSelect">使用する地域パック</label>
                  <select id="packSelect">
                    <option value="">未選択</option>
                  </select>
                  <div class="button-grid two-columns">
                    <button id="installSampleButton" type="button">熊本県嘉島町をダウンロード</button>
                    <button id="importPackButton" type="button">端末から読込</button>
                  </div>
          """
          new_region = """        <label for="catalogSelect">ダウンロード可能な地域パック</label>
                  <select id="catalogSelect">
                    <option value="">地域カタログを読み込み中…</option>
                  </select>
                  <div class="button-grid two-columns">
                    <button id="installSampleButton" type="button">選択地域をダウンロード</button>
                    <button id="importPackButton" type="button">端末から読込</button>
                  </div>
                  <p class="help">嘉島町に限定せず、カタログへ追加された全国の地域パックを選択できます。</p>

                  <label for="packSelect">端末に保存済みの地域パック</label>
                  <select id="packSelect">
                    <option value="">未選択</option>
                  </select>
          """
          index = replace_once(index, old_region, new_region, 'region catalog controls')
          layer_marker = """        <button id="deleteActivePackButton" class="danger-outline" type="button" disabled>選択中パックを削除</button>
                </section>

                <section class="panel-section">
                  <h2>表示レイヤー</h2>
          """
          layer_replacement = """        <button id="deleteActivePackButton" class="danger-outline" type="button" disabled>選択中パックを削除</button>
                </section>

                <section class="panel-section">
                  <h2>ALOS-2衛星レイヤー</h2>
                  <label for="alos2ProductSelect">公開・変換済みプロダクト</label>
                  <select id="alos2ProductSelect">
                    <option value="">カタログを読み込み中…</option>
                  </select>
                  <div class="button-grid two-columns">
                    <button id="installAlos2Button" type="button">ALOS-2データを取得</button>
                    <button id="clearAlos2Button" class="danger-outline" type="button">保存済みを削除</button>
                  </div>
                  <label for="alos2Opacity">衛星レイヤー透明度</label>
                  <input id="alos2Opacity" type="range" min="0" max="100" value="65">
                  <div id="alos2Info" class="info-box">ALOS-2カタログを確認中です。</div>
                  <p class="help">JAXAのGeoTIFF原データは外部PCでWeb表示用に軽量変換してから登録します。公開データがない地域では公式公開状況を表示します。</p>
                </section>

                <section class="panel-section">
                  <h2>表示レイヤー</h2>
          """
          index = replace_once(index, layer_marker, layer_replacement, 'alos section')
          index = replace_once(
              index,
              '        <div class="check-grid">\n          <label><input type="checkbox" data-layer="basemap" checked> 基本道路・水域</label>',
              '        <div class="check-grid">\n          <label><input id="osmBasemap" type="checkbox" checked> OpenStreetMap背景（オンライン）</label>\n          <label><input type="checkbox" data-layer="basemap" checked> 地域パック内の道路・水域</label>',
              'osm checkbox'
          )
          index = replace_once(
              index,
              '        <button id="toggle3dButton" type="button" title="2D・3D切替">3D</button>\n        <button id="locateButton"',
              '        <button id="toggle3dButton" type="button" title="2D・3D切替">3D</button>\n        <button id="bearingResetButton" type="button" title="方位を北に戻す">N</button>\n        <span id="bearingBadge" class="bearing-badge">方位 0°</span>\n        <button id="locateButton"',
              'bearing controls'
          )
          index = replace_once(
              index,
              '      <div class="map-scale" id="mapScale">縮尺計算中</div>',
              '      <div class="map-gesture-help">左ドラッグ：移動／右ドラッグまたはShift＋ドラッグ：方位・傾斜回転</div>\n      <div class="map-scale" id="mapScale">縮尺計算中</div>',
              'gesture help'
          )
          index_path.write_text(index, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("const APP_VERSION = '0.1.0';", "const APP_VERSION = '0.2.0';", 1)
          sw = replace_once(sw, "  './app.js',\n  './styles.css',", "  './app.js',\n  './enhancements.js',\n  './styles.css',", 'sw enhancements')
          sw = replace_once(sw, "  './data/catalog.json'\n];", "  './data/catalog.json',\n  './data/alos2/catalog.json'\n];", 'sw alos catalog')
          sw_path.write_text(sw, encoding='utf-8')

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          css = """

          .bearing-badge {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 0 9px;
            border: 1px solid rgba(255, 255, 255, .72);
            border-radius: 8px;
            background: rgba(20, 42, 56, .82);
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
          }

          .map-gesture-help {
            position: absolute;
            left: 12px;
            bottom: 46px;
            z-index: 4;
            max-width: min(520px, calc(100% - 24px));
            padding: 5px 9px;
            border-radius: 7px;
            background: rgba(20, 42, 56, .78);
            color: #fff;
            font-size: 12px;
            pointer-events: none;
          }

          #catalogSelect,
          #alos2ProductSelect {
            width: 100%;
          }
          """
          if '.bearing-badge {' not in styles:
              styles += css
          styles_path.write_text(styles, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          if '## 0.2.0 - 2026-07-29' not in changelog:
              changelog = changelog.replace(
                  '# CHANGELOG\n',
                  '# CHANGELOG\n\n## 0.2.0 - 2026-07-29\n\n- 全国地域パック選択UIを追加\n- OpenStreetMapオンライン背景を追加\n- 右ドラッグ／Shift+ドラッグによる方位・傾斜回転を追加\n- ALOS-2軽量衛星レイヤーの取得・端末保存・重畳表示を追加\n- ALOS-2公開状況カタログとクレジット表示を追加\n\n',
                  1
              )
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check enhancements.js
          node --check sw.js
          python3 -m json.tool data/catalog.json > /dev/null
          python3 -m json.tool data/alos2/catalog.json > /dev/null

      - name: Commit upgrade
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js styles.css CHANGELOG.md
          git commit -m "全国地図・3D回転・ALOS-2表示を統合"
          git push
