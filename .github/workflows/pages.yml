name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build SAIKAN application
        run: |
          cat app-v3c/part-00.txt \
              app-v3c/part-01.txt \
              app-v3c/part-02.txt \
              app-v3c/part-03.txt \
              app-v3c/part-04.txt > app-v3.js

          python3 tools/patch_v031.py
          python3 tools/patch_index_v031.py

          mkdir -p vendor
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/davidshimjs/qrcodejs/04f46c6a0708418cb7b96fc563eacae0fbf77674/qrcode.min.js \
            --output vendor/qrcode.min.js
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/davidshimjs/qrcodejs/04f46c6a0708418cb7b96fc563eacae0fbf77674/LICENSE \
            --output vendor/qrcodejs-LICENSE.txt

          test -s vendor/qrcode.min.js
          test -s vendor/qrcodejs-LICENSE.txt
          node --check app-v3.js
          node --check share-v31.js
          grep -q "const APP_VERSION = '0.3.1'" app-v3.js
          grep -q "window.SAIKAN_SHARE_API" app-v3.js
          grep -q "QR分割オフライン共有" index.html
          grep -q "vendor/qrcode.min.js" index.html
          python3 -m json.tool data/catalog.json > /dev/null
          python3 -m json.tool data/updates/catalog.json > /dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
